name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync (locked)
        run: uv sync --all-extras --all-groups
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src/
      - name: Pytest
        run: uv run pytest
      - name: Sphinx (en + pt)
        env:
          DOCS_PREFIX: /capybucks
        run: uv run --group docs python docs/build.py
      - name: Sphinx asset paths after flatten
        run: |
          grep -F 'href="_static/styles/pydata-sphinx-theme.css' docs/_build/html/en/index.html
          grep -F 'href="../_static/styles/pydata-sphinx-theme.css' docs/_build/html/en/guide/download.html
          grep -F 'href="_static/styles/pydata-sphinx-theme.css' docs/_build/html/pt/index.html
