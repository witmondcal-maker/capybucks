[project]
name = "capybucks"
version = "0.0.1"
description = "The capybara-powered finance data library for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ricardo Margalho", email = "ricardo@penarede.com.br" },
]
keywords = ["finance", "market-data", "ohlcv", "equities", "crypto"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "tenacity>=9.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
ta = ["pandas>=2.2"]
calendars = ["exchange-calendars>=4.5"]
stream = ["websockets>=14.0"]

[project.urls]
Homepage = "https://github.com/witmondcal-maker/capybucks"
Documentation = "https://witmondcal-maker.github.io/capybucks/"
Repository = "https://github.com/witmondcal-maker/capybucks"
Issues = "https://github.com/witmondcal-maker/capybucks/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]
docs = [
    "myst-parser>=4.0",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8.0",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capybucks"]

[tool.hatch.build.targets.sdist]
include = ["src/capybucks", "docs", "examples", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["capybucks"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["websockets.*", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs; excluded from default CI",
]
addopts = "-m \"not live\""
